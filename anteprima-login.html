<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anteprima Login Mobile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); overflow: hidden; position: relative; padding: 16px; }

  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.15; animation: float 15s infinite ease-in-out; }
  .b1 { width: 250px; height: 250px; background: #10b981; top: -80px; left: -80px; }
  .b2 { width: 300px; height: 300px; background: #10b981; bottom: -100px; right: -100px; animation-delay: 3s; }
  .b3 { width: 150px; height: 150px; background: #3b82f6; top: 40%; left: 50%; animation-delay: 6s; opacity: 0.08; }
  @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,-30px); } }

  .card {
    position: relative; z-index: 10; width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(20px);
    border-radius: 28px; padding: 36px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    animation: enter 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes enter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .logo-wrap { text-align: center; margin-bottom: 28px; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 14px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    color: white; font-size: 26px; font-weight: 800; letter-spacing: -1px;
    box-shadow: 0 6px 20px rgba(16,185,129,0.35);
  }
  .title { font-size: 20px; font-weight: 700; color: #1e293b; }
  .subtitle { font-size: 13px; color: #64748b; margin-top: 3px; }

  .badge { text-align: center; margin-bottom: 24px; }
  .badge p { font-size: 13px; font-weight: 600; color: #059669; }

  .field { margin-bottom: 18px; }
  .label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 7px; }
  .input-wrap { position: relative; }
  .input {
    width: 100%; padding: 15px 16px; font-size: 16px;
    border: 2px solid #e2e8f0; border-radius: 14px;
    background: #f8fafc; color: #1e293b; outline: none;
    transition: all 0.25s ease; -webkit-appearance: none;
  }
  .input:focus { border-color: #10b981; background: white; box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
  .input::placeholder { color: #cbd5e1; }

  .eye-btn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    color: #94a3b8; display: flex; align-items: center;
  }
  .eye-btn:active { color: #10b981; }

  .btn {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 700;
    background: linear-gradient(135deg, #10b981, #059669); color: white;
    border: none; border-radius: 14px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    transition: all 0.2s ease; margin-top: 6px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
  .btn:active { transform: scale(0.97); }

  .footer { text-align: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
  .footer p { font-size: 12px; color: #94a3b8; }

  .error {
    background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
    padding: 12px 14px; border-radius: 12px; font-size: 13px;
    margin-bottom: 16px; display: none;
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="card">
    <div class="logo-wrap">
      <div class="logo">PF</div>
      <div class="title">Portale Documenti</div>
      <div class="subtitle">Accesso riservato ai clienti</div>
    </div>

    <div class="badge">
      <p>I tuoi documenti fiscali, sempre con te.</p>
    </div>

    <div class="error" id="err">Username o password non corretti.</div>

    <form onsubmit="event.preventDefault(); document.getElementById('err').style.display='block';">
      <div class="field">
        <label class="label">Username</label>
        <div class="input-wrap">
          <input type="text" class="input" placeholder="Inserisci il tuo username" autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label class="label">Password</label>
        <div class="input-wrap">
          <input type="password" class="input" id="pwd" placeholder="Inserisci la tua password" autocomplete="current-password" style="padding-right: 48px;">
          <button type="button" class="eye-btn" onclick="var p=document.getElementById('pwd'); p.type=p.type==='password'?'text':'password'; this.innerHTML=p.type==='text'?'nascondi':'mostra';">
            mostra
          </button>
        </div>
      </div>

      <button type="submit" class="btn">Accedi al Portale</button>
    </form>

    <div class="footer">
      <p>Portale sicuro e riservato · Tutti i diritti riservati</p>
    </div>
  </div>
</body>
</html>
